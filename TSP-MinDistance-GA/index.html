<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TSP Min Distance - Genetic Algorithm</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Poppins -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.2/p5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Traveling Salesman Problem</h1>
        <p>Find the shortest route visiting selected U.S. cities using Genetic Algorithm</p>
        <div class="controls">
            <label for="city-count">Number of Cities: </label>
            <input type="number" id="city-count" min="1" max="50" value="25" style="width: 50px;">
            <span>(1 to 50)</span>
            <button id="run-btn">Run</button>
        </div>
    </header>
    <main>
        <div class="card">
            <div class="canvas-container">
                <div id="sketch-holder"></div>
            </div>
            <div class="controls">
                <button id="restart-btn">Restart Simulation</button>
            </div>
        </div>
    </main>
    <footer>
        <p>Created by <a href="https://github.com/jitendrabhamare">Jitendra Bhamare</a></p>
    </footer>
    <script src="sketch.js"></script>
    <script>
        // Run button functionality
        document.getElementById('run-btn').addEventListener('click', () => {
            updateInput();
        });

        // Restart button functionality
        document.getElementById('restart-btn').addEventListener('click', () => {
            if (typeof resetSketch === 'function') {
                resetSketch();
            } else {
                console.log("Please define resetSketch() in sketch.js to reset the simulation.");
            }
        });
    </script>
</body>
</html>
